<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<title>Premise</title>
<style>
	/* The video's last frame. Open it with ?repo=github.com/OWNER/premise to show the repo address. */
	:root { color-scheme: only light; }
	html, body { height: 100%; margin: 0; }
	body { background: #EDF0F3; color: #17202B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; align-items: center; }
	main { margin-left: 12vw; max-width: 900px; }
	h1 { font-size: 48px; line-height: 1; margin: 0 0 24px; font-weight: 700; letter-spacing: 0.01em; font-stretch: condensed; }
	p { margin: 0; }
	.tagline { font-size: 32px; line-height: 1.25; font-weight: 600; }
	.tagline span { display: block; }
	.where { margin-top: 48px; font-size: 20px; line-height: 1.6; color: #5A6675; }
	.where b { color: #17202B; font-weight: 600; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 18px; }
	.built { margin-top: 48px; font-size: 16px; color: #5A6675; }
</style>
</head>
<body>
<main>
	<h1>Premise</h1>
	<p class="tagline"><span>Git tracks what agents wrote.</span><span>Premise tracks what they assumed.</span></p>
	<p class="where">
		Code, MIT licence: <b id="repo">the repository link is in the submission</b><br>
		The recorded run: <b>premise.akshatdivekar.workers.dev/?demo=main</b> then press →
	</p>
	<p class="built">Built on Cloudflare Workers + Artifacts</p>
</main>
<script>
	// Only letters, digits and the characters a repo address needs are shown, whatever the query says.
	const repo = new URLSearchParams(location.search).get("repo");
	if (repo && /^[\w.\-/]+$/.test(repo)) {
		document.getElementById("repo").textContent = repo;
	}
</script>
</body>
</html>
